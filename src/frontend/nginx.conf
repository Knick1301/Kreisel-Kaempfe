# nginx in der Testumgebung: liefert die gebaute Vue-App aus und leitet
# /api (REST) und /ws (WebSocket für den Arena-Modus) an das Backend weiter –
# genau wie der Vite-Dev-Proxy in vite.config.ts.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /ws/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_read_timeout 1h;
    }

    # Vue-Router (History-Modus): unbekannte Pfade auf index.html umleiten
    location / {
        try_files $uri $uri/ /index.html;
    }
}
