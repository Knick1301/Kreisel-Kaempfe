# CI/CD-Pipeline für Kreisel-Kämpfe
#
#   1. backend      – Maven: kompilieren, Tests, JAR paketieren
#   2. frontend     – npm: Lint, Type-Check, Tests, Vite-Build
#   3. deploy-test  – beide Docker-Images bauen, Testumgebung per docker compose
#                     starten und mit einem Smoke-Test prüfen
#   4. publish      – nur auf main: Docker-Images in die GitHub Container Registry
#
# Ausgelöst bei jedem Push (alle Branches), bei Pull Requests nach main und manuell.
name: CI/CD

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Ältere Läufe desselben Branches abbrechen, wenn neu gepusht wird
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend bauen (Java 21 / Maven)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: src/backend/pom.xml

      - name: Build-Skript ausführen
        run: ./scripts/build.sh backend

      - name: Backend-JAR archivieren
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: src/backend/target/*.jar
          retention-days: 14

      - name: Testberichte hochladen (bei Fehler)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-testberichte
          path: src/backend/target/surefire-reports/

  frontend:
    name: Frontend bauen (Node 24 / npm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Build-Skript ausführen
        run: ./scripts/build.sh frontend

      - name: Frontend-Build archivieren
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: src/frontend/dist/
          retention-days: 14

  deploy-test:
    name: In Testumgebung bereitstellen (Docker)
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Testumgebung starten
        run: docker compose up -d --build

      - name: Smoke-Test gegen die Testumgebung
        run: ./scripts/smoke-test.sh http://localhost:8081

      - name: Container-Logs anzeigen (bei Fehler)
        if: failure()
        run: docker compose logs --no-color

      - name: Testumgebung abbauen
        if: always()
        run: docker compose down -v

  publish:
    name: Docker-Images veröffentlichen (GHCR)
    needs: deploy-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Image-Namen festlegen
        run: echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Backend-Image bauen und pushen
        uses: docker/build-push-action@v6
        with:
          context: src/backend
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-backend:latest
            ${{ env.IMAGE_PREFIX }}-backend:${{ github.sha }}

      - name: Frontend-Image bauen und pushen
        uses: docker/build-push-action@v6
        with:
          context: src/frontend
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-frontend:latest
            ${{ env.IMAGE_PREFIX }}-frontend:${{ github.sha }}
